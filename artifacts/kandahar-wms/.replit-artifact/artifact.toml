kind = "web"
previewPath = "/"
title = "Kandahar WMS"
version = "1.0.0"
id = "artifacts/kandahar-wms"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23764

[services.development]
run = "pnpm --filter @workspace/kandahar-wms run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kandahar-wms", "run", "build" ]
publicDir = "artifacts/kandahar-wms/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23764"
BASE_PATH = "/"
